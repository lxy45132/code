contract_version: 1
experiment_id: smoke
seed: 2026

model:
  name: hybrid_unet_vit_smoke
  in_channels: 4
  out_channels: 3
  channels: [16, 32, 64, 128]
  vit_depth: 2
  vit_heads: 4
  vit_patch: 2
  vit_mlp_ratio: 2.0
  norm: instance
  dropout: 0.0

data:
  dataset: synthetic
  root: ../data/synthetic
  mask_dir: ../data/synthetic_masks
  image_size: 64
  num_workers: 0
  train_split: train
  val_split: val
  test_split: test
  train_samples: 16
  val_samples: 8

train:
  stage: stage1
  iterations: 200
  batch_size: 1
  lr: 0.0001
  betas: [0.5, 0.999]
  weight_decay: 0.0
  warmup_steps: 10
  min_lr: 0.000001
  grad_clip: 1.0
  precision: fp32
  val_every: 50
  val_batch_size: 4
  patience: 3
  log_every: 10
  seed: 2026
  device: cpu
  output_dir: ../outputs
  loss:
    l1_hole: 1.0
    l1_valid: 0.5
    perceptual: 0.1
    tv: 0.05
    adversarial: 0.1

eval:
  test_split: test
  masks_per_image: 2
  resolutions: [64]
  compute_lpips: false
  compute_fid: false

system:
  model_id: smoke
  checkpoint: ../outputs/smoke/checkpoints/last.pt
  device: cpu
  pad_multiple: 16
  tiling:
    tile_size: 64
    tile_overlap: 8
  history_db: ../outputs/smoke/history.sqlite
  output_dir: ../outputs/smoke/history
  limits:
    max_file_mb: 20
    max_side: 4096
    max_pixels: 16777216
  web:
    host: 127.0.0.1
    port: 8001
  busy_timeout_s: 2.0
