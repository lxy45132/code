contract_version: 1
experiment_id: system

system:
  model_id: main
  checkpoint: ../outputs/main/seed_2026/checkpoints/best_psnr.pt
  device: cuda
  pad_multiple: 16
  tiling:
    tile_size: 512
    tile_overlap: 64
  history_db: ../outputs/history.sqlite
  output_dir: ../outputs/history
  limits:
    max_file_mb: 20
    max_side: 4096
    max_pixels: 16777216
  web:
    host: 127.0.0.1
    port: 8000
    workers: 1
  busy_timeout_s: 2.0
  # C7 Web 栈（03 文档）：默认 sqlite 保持零依赖；切 MySQL 时改 backend
  # 并配置 mysql 节（密码走环境变量，不入库不入 Git）。
  inference:
    mode: inline
    chunk_size: 8
  storage:
    backend: sqlite
  redis:
    url: redis://127.0.0.1:6379/0
  celery:
    broker_db: 1
    result_db: 2
    retries: 3
  batch:
    max_items: 32
  api:
    cors_origins:
      - http://localhost:5173
