contract_version: 1
experiment_id: system

system:
  model_id: main
  # 正式权重（stage2，seed 2026）。切换 Places365 主模型：
  #   model_id: places_main
  #   checkpoint: ../model/places_main/seed_2026/best_psnr.pt
  checkpoint: ../model/main/seed_2026/best_psnr.pt
  device: cuda
  pad_multiple: 16
  tiling:
    tile_size: 512
    tile_overlap: 64
  history_db: ../outputs/history.sqlite
  output_dir: ../outputs/history
  limits:
    max_file_mb: 20
    max_side: 4096
    max_pixels: 16777216
  web:
    host: 127.0.0.1
    port: 8000
    workers: 1
  busy_timeout_s: -1  # -1 = FIFO 无限排队不拒绝（03 文档 §4）
  # C7 Web 栈（03 文档）：MySQL 权威状态；密码经 .env/环境变量注入，不入 Git。
  inference:
    mode: inline
    chunk_size: 8
    # 模型只在 256 尺度训练；超过 384 的大图先缩放推理再放大回洞内，
    # 避免 ViT+GAN 在非训练尺度上的网格伪影。null 关闭该归一化。
    max_side: 384
  storage:
    backend: mysql
    mysql:
      host: 127.0.0.1
      port: 3306
      user: root
      database: hybrid_inpaint
  redis:
    url: redis://127.0.0.1:6379/0
  celery:
    broker_db: 1
    result_db: 2
    retries: 3
  batch:
    max_items: 32
  api:
    cors_origins:
      - http://localhost:5173
