# 完整容器化演示编排（docs/03 §10）：mysql + redis + api + worker (+flower)。
# CPU 推理演示用；生产 GPU worker 建议宿主机直跑 hybrid-inpaint worker。
# 启动：docker compose up --build -d；监控：docker compose --profile monitor up -d
# 敏感项经环境变量注入（.env 不入 Git）。

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hybrid_inpaint
      MYSQL_USER: hybrid
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hybrid}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment: &app_env
      HYBRID_INPAINT__SYSTEM__STORAGE__BACKEND: mysql
      HYBRID_INPAINT__SYSTEM__STORAGE__MYSQL__HOST: mysql
      HYBRID_INPAINT__SYSTEM__STORAGE__MYSQL__PORT: "3306"
      HYBRID_INPAINT__SYSTEM__STORAGE__MYSQL__USER: hybrid
      HYBRID_INPAINT__SYSTEM__STORAGE__MYSQL__PASSWORD: ${MYSQL_PASSWORD:-hybrid}
      HYBRID_INPAINT__SYSTEM__STORAGE__MYSQL__DATABASE: hybrid_inpaint
      HYBRID_INPAINT__SYSTEM__REDIS__URL: redis://redis:6379/0
      HYBRID_INPAINT__SYSTEM__INFERENCE__MODE: worker
      HYBRID_INPAINT__SYSTEM__WEB__WORKERS: "2"
      HYBRID_INPAINT__SYSTEM__DEVICE: cpu
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "uv run --no-sync hybrid-inpaint db init -c configs/system.yaml &&
             uv run --no-sync hybrid-inpaint start -c configs/system.yaml --host 0.0.0.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    environment: *app_env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run --no-sync hybrid-inpaint worker -c configs/system.yaml --loglevel INFO

  flower:
    image: mher/flower:2.0
    profiles: ["monitor"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      FLOWER_PORT: "5555"
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql_data:
